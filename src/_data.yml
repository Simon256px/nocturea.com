# Site-wide data. Everything here is available to every page and layout,
# so the nav, footer and copyright live in exactly one place.
layout: layouts/base.vto

ogImage: https://nocturea.com/public/nocturea-og.png
copyright: "© 2020 – 2027 Nocturea"
fonts: "https://fonts.googleapis.com/css2?family=Archivo:wght@200;400;500;700;900&display=swap"

# Cache buster for the stylesheet and the mark, which keep the same filename
# every time their contents change. Neither is served with a Cache-Control
# header, so browsers cache them heuristically — and favicons far longer than
# that. Bump this whenever global.css or nocturea-mark.svg changes, otherwise
# returning visitors keep the old one: that is how the green mark survived the
# rebrand in tabs that had already seen it.
assetVersion: "2026-08-18h"

# Drives both the header nav and the footer links.
nav:
  - key: work
    label: Work
    url: /work.html
  - key: services
    label: Services
    url: /services.html
  - key: about
    label: About
    url: /about.html
  - key: contact
    label: Contact
    url: /contact.html
    cta: true
